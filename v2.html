
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102d46">
<title>Curios — Explorer le savoir</title>
<style>
:root{--navy:#102d46;--turq:#20aab5;--paper:#f3f7f9;--ink:#173247;--muted:#718696;--line:#e1eaf0}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}
button,input{font:inherit}
.app{max-width:760px;min-height:100vh;margin:auto;padding-bottom:85px}
.hero{background:var(--navy);color:white;padding:24px 20px 26px;border-radius:0 0 27px 27px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:26px;font-weight:900;letter-spacing:2px}
.tag{font-size:10px;letter-spacing:2px;color:#b9d8e2}
.avatar{border:1px solid #648398;border-radius:50%;background:#204b66;color:white;width:44px;height:44px;font-size:22px}
.hello{margin-top:25px;color:#c6dce5;font-size:13px}
.headline{font-size:25px;font-weight:850}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}
.stat{padding:12px;background:#1b4962;border:1px solid #315b72;border-radius:15px}
.stat strong{display:block;font-size:22px}
.stat span{font-size:11px;color:#c6dce5}
.content{padding:20px 16px}
.eyebrow{font-size:10px;letter-spacing:1.6px;font-weight:850;color:var(--muted)}
h1{font-size:24px;margin:5px 0}
h2{font-size:18px;margin:0}
.intro{font-size:13px;line-height:1.5;color:var(--muted);margin:5px 0 18px}
.pack{padding:20px;border-radius:22px;background:linear-gradient(135deg,#147f91,#20aab5);color:white}
.pack h2{font-size:21px;margin:7px 0}
.pack p{font-size:13px;line-height:1.5;color:#e2fbfc}
.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:800;background:var(--navy);color:white}
.btn.light{background:white;color:#116b79}
.btn.soft{background:#e8f5f7;color:#126d78}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:16px}
.tile{text-align:left;color:var(--ink);min-height:110px}
.tile .ico{font-size:23px}
.tile b{display:block;margin:8px 0 3px}
.tile small,.muted{font-size:12px;color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);padding:9px 5px calc(9px + env(safe-area-inset-bottom));background:white;border-top:1px solid var(--line)}
.nav button{border:0;background:none;color:#8193a0;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button span{font-size:21px}
.nav button.active{color:#118b99}
.field,.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin:8px 0 14px;background:white}
.course{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.empty{padding:28px 15px;text-align:center;color:var(--muted);background:white;border:1px dashed #cbd9e1;border-radius:17px}
</style>
</head>
<body>
<div class="app">
<header class="hero">
<div class="top">
<div><div class="logo">CURIOS</div><div class="tag">APPRENDRE · EXPLORER · DÉCOUVRIR</div></div>
<button class="avatar" id="avatarBtn">🔭</button>
</div>
<div class="hello" id="hello">Bienvenue, Explorateur</div>
<div class="headline">Le savoir est une aventure.</div>
<div class="stats">
<div class="stat"><strong id="completedCount">0</strong><span>Cours terminés</span></div>
<div class="stat"><strong id="cardCount">0</strong><span>Cartes obtenues</span></div>
<div class="stat"><strong id="progressCount">0 %</strong><span>Bibliothèque</span></div>
</div>
</header>
<main class="content" id="view"></main>
</div>
<nav class="nav">
<button class="active" data-page="home"><span>⌂</span>Accueil</button>
<button data-page="collections"><span>▧</span>Collections</button>
<button data-page="encyclopedia"><span>⌕</span>Encyclopédie</button>
<button data-page="profile"><span>◎</span>Profil</button>
</nav>
<script src="v2.js"></script>
</body>
</html>
