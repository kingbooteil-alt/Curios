*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100dvh;padding-bottom:94px}.top{background:var(--navy);color:white;padding:22px 20px 25px;border-radius:0 0 26px 26px}.topline{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:850;letter-spacing:2px}.tag{font-size:10px;letter-spacing:2px;color:#b8d7e2;margin-top:2px}.avatar{width:42px;height:42px;border-radius:50%;border:1px solid #5b8298;background:#204b66;color:white;font-weight:700}.content{padding:18px 16px}.welcome{font-size:14px;color:#c5dce6;margin-top:18px}.headline{font-size:23px;line-height:1.2;font-weight:800;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:19px}.stat{background:#1b4962;border:1px solid #315b72;border-radius:15px;padding:12px 10px}.stat strong{display:block;font-size:22px}.stat span{font-size:11px;color:#c4dce5}.section-head{display:flex;justify-content:space-between;align-items:center;margin:21px 2px 12px}.section-head h2{font-size:17px;margin:0}.muted{color:var(--muted);font-size:12px}.pack{background:linear-gradient(135deg,#147f91,#20aab5);border-radius:22px;padding:19px;color:white;box-shadow:var(--shadow);position:relative;overflow:hidden}.pack:after{content:'✦';position:absolute;right:19px;top:-21px;font-size:110px;color:#ffffff20}.pack h2{font-size:21px;margin:0 0 5px}.pack p{font-size:13px;color:#e2fbfc;margin:0 0 15px;max-width:80%}.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:750;background:var(--navy);color:white}.btn.primary{background:white;color:#116b79}.btn.ghost{background:#e8f5f7;color:#126d78}.btn.secondary{background:#eaf0f4;color:#29475b}.btn:disabled{opacity:.45;cursor:not-allowed}.tilegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{border:1px solid var(--line);border-radius:17px;background:white;padding:15px;text-align:left;color:var(--ink);box-shadow:0 4px 15px #102d4608}.tile .ico{font-size:22px}.tile b{display:block;margin-top:7px}.tile small{color:var(--muted)}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:9px max(10px,calc((100vw - 760px)/2)) calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 -8px 24px #102d460c}.nav button{border:0;background:none;color:#7c91a0;font-size:10px;font-weight:650;display:flex;flex-direction:column;gap:3px;align-items:center}.nav button span{font-size:21px}.nav button.active{color:#118b99}.page-title{font-size:24px;font-weight:850;margin:3px 0 4px}.sub{color:var(--muted);font-size:13px;line-height:1.5}.cardbox,.panel{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin:12px 0;box-shadow:0 5px 18px #102d4608}.discipline{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:750;padding:6px 9px;border-radius:999px;background:var(--chip,#eaf5f6);color:var(--accent,#147b88)}.choice{width:100%;text-align:left;border:1px solid var(--line);border-radius:17px;background:white;padding:15px;margin:7px 0;color:var(--ink)}.choice:active{transform:scale(.99)}.choice h3{margin:9px 0 5px;font-size:17px}.choice p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.lesson h1{font-size:27px;line-height:1.15;margin:12px 0}.lesson h2{font-size:18px;margin:23px 0 8px}.lesson p{font-size:15px;line-height:1.75;color:#334f62}.lesson .lead{font-size:16px;color:#426074}.fact{background:#eaf8f8;border-left:4px solid var(--turq);padding:13px;border-radius:10px;margin:17px 0;font-size:13px;line-height:1.55}.progress{height:6px;background:#e7eef2;border-radius:20px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:var(--turq);width:0}.qoption{display:block;width:100%;text-align:left;padding:13px;border:1px solid var(--line);background:white;border-radius:12px;margin:8px 0;color:var(--ink)}.qoption.selected{border:2px solid var(--turq);background:#effbfc}.qoption.correct{border:2px solid #38a878;background:#effaf4}.qoption.wrong{border:2px solid #d96d6d;background:#fff4f4}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:6px 0 13px;background:#fff;color:var(--ink)}.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:14px 0;background:white}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.cardvisual{border-radius:18px;padding:14px;background:linear-gradient(145deg,var(--accent,#147b88),#102d46);color:white;max-width:300px;margin:12px auto;box-shadow:0 16px 35px #102d4630}.photo{height:150px;border-radius:12px;background:linear-gradient(135deg,#d4edf0,#7ab7c0);display:grid;place-items:center;font-size:64px;overflow:hidden}.cardvisual h3{font-size:19px;margin:12px 0 4px}.cardvisual p{font-size:12px;color:#e2f3f6;line-height:1.5}.empty{text-align:center;padding:32px 16px;color:var(--muted)}.empty .big{font-size:42px}.smallcaps{font-size:10px;letter-spacing:1.5px;font-weight:800;color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#173d55;color:white;padding:11px 16px;border-radius:30px;font-size:13px;z-index:10;box-shadow:var(--shadow)}.packanim{animation:pop .45s ease both}@keyframes pop{0%{opacity:0;transform:scale(.85) rotate(-3deg)}70%{transform:scale(1.03)}100%{opacity:1;transform:scale(1)}}.flip{animation:flip .65s ease both}@keyframes flip{0%{transform:rotateY(90deg);opacity:0}100%{transform:rotateY(0);opacity:1}}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.pill{border:1px solid var(--line);border-radius:30px;background:white;padding:8px 12px;white-space:nowrap;font-size:12px;color:#476274}.pill.active{background:var(--navy);color:white;border-color:var(--
